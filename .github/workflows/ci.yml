name: ci

# Actions pinned by SHA, the same pins as faxforagents/mcp.
# The ci-speedup audit of faxforagents/mcp (2026-11-19) measured its whole PR wait at about 24 s, with no
# check worth reshaping. What carries over: one lint job beside the test matrix, so lint runs once and not
# on every Node version, a shallow checkout, and cancelling a run that a newer push replaces.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: types, lint and package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: The package holds what it should and nothing else
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"

  test:
    name: build and test on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20.0.0 is the oldest Node that package.json allows, the others the newest of each line.
        node: ["20.0.0", "20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
